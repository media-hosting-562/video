<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        .video-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; }
        .audio-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9); color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; display: block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="video-container">
        <button id="unmuteBtn" class="audio-btn" onclick="toggleAudio()">🔊 ACTIVAR SONIDO</button>
        <video id="myVideo" autoplay muted playsinline loop preload="auto">
            <source src="tu_video.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de vídeo.
        </video>
        <div class="shield"></div>
    </div>

    <script>
        function toggleAudio() {
            var video = document.getElementById("myVideo");
            var btn = document.getElementById("unmuteBtn");
            video.muted = false;
            video.currentTime = 0; 
            btn.style.display = "none"; 
        }
    </script>
</body>
</html>
